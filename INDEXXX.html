<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sriman Consultancy - Daily Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
            text-align: center;
        }
        h2 {
            color: #1a365d;
            margin-bottom: 5px;
        }
        p {
            color: #718096;
            font-size: 14px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            text-align: left;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 5px;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #2b6cb0;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #2c5282;
        }
        #statusMessage {
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Sriman Consultancy</h2>
    <p>Daily Employee Attendance Portal</p>
    
    <form id="attendanceForm">
        <label for="employeeName">Select Employee Name:</label>
        <select id="employeeName" required>
            <option value="">-- Select Your Name --</option>
            <option value="M. NARESH">M. NARESH</option>
            <option value="T. KUMAR">T. KUMAR</option>
            <option value="K. PRIYANKA">K. PRIYANKA</option>
            <option value="P. SWATHI">P. SWATHI</option>
            <option value="J. RAJ KUMAR">J. RAJ KUMAR</option>
        </select>

        <label for="action">Action:</label>
        <select id="action" required>
            <option value="Check-In">Check-In (Office Ki Vachanu)</option>
            <option value="Check-Out">Check-Out (Office Nundi Velthunnanu)</option>
        </select>

        <button type="button" onclick="submitAttendance()">Submit Login</button>
    </form>

    <div id="statusMessage"></div>
</div>

<script>
    function submitAttendance() {
        const name = document.getElementById('employeeName').value;
        const action = document.getElementById('action').value;
        const statusMsg = document.getElementById('statusMessage');

        if (!name) {
            statusMsg.style.color = "red";
            statusMsg.innerText = "Please select your name!";
            return;
        }

        const currentTime = new Date().toLocaleString();

        // Display Success Message
        statusMsg.style.color = "green";
        statusMsg.innerText = `${name} logged ${action} successfully at ${currentTime}`;
        
        // Reset dropdown after submission
        document.getElementById('attendanceForm').reset();
    }
</script>

</body>
</html>
