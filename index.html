<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sriman Consultancy - Daily Login & Calendar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
       body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('https://upload.wikimedia.org/wikipedia/commons/e/e1/Ram_Darbar_statue.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
         }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            text-align: center;
            margin-bottom: 20px;
        }
        h2 { color: #8B0000; margin-bottom: 5px; font-size: 24px; text-transform: uppercase; }
        p { color: #4A5568; font-size: 14px; margin-bottom: 20px; font-weight: 600; }
        label { display: block; text-align: left; font-weight: bold; color: #2D3748; margin-bottom: 5px; }
        select {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #CBD5E0; border-radius: 8px; font-size: 15px; outline: none;
        }
        button {
            width: 100%; background-color: #B22222; color: white; padding: 12px;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
        }
        button:hover { background-color: #8B0000; }
        #statusMessage { margin-top: 12px; font-weight: bold; font-size: 14px; }
        
        /* Calendar Styling */
        .calendar-card {
            width: 100%; max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px; border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .calendar-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; font-weight: bold; color: #8B0000; font-size: 18px;
        }
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center;
        }
        .day-header { font-weight: bold; color: #4A5568; padding: 8px 0; font-size: 13px; }
        .day-cell {
            padding: 10px 2px; border-radius: 6px; background: #F7FAFC;
            border: 1px solid #E2E8F0; font-size: 12px; min-height: 50px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
        }
        .day-number { font-weight: bold; color: #2D3748; margin-bottom: 3px; }
        .badge { font-size: 9px; padding: 2px 4px; border-radius: 4px; color: white; font-weight: bold; width: 90%; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .bg-checkin { background-color: #28a745; }
        .bg-checkout { background-color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚩 Sriman Consultancy 🚩</h2>
    <p>Daily Employee Attendance Portal</p>
    
    <form id="attendanceForm">
        <label for="employeeName">Select Employee Name:</label>
        <select id="employeeName" required>
            <option value="">-- Select Your Name --</option>
            <option value="M. NARESH">M. NARESH</option>
            <option value="T. KUMAR">T. KUMAR</option>
            <option value="K. PRIYANKA">K. PRIYANKA</option>
            <option value="P. SWATHI">P. SWATHI</option>
            <option value="J. RAJ KUMAR">J. RAJ KUMAR</option>
        </select>

        <label for="action">Action:</label>
        <select id="action" required>
            <option value="Check-In">Check-In (Office Ki Vachanu)</option>
            <option value="Check-Out">Check-Out (Office Nundi Velthunnanu)</option>
        </select>

        <button type="button" onclick="submitAttendance()">Submit Attendance</button>
    </form>

    <div id="statusMessage"></div>
</div>

<div class="calendar-card">
    <div class="calendar-header" id="calendarTitle">Month Calendar</div>
    <div class="calendar-grid" id="calendarGrid"></div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUu2LmXK3uSbLYNi-cBYGrcimB8yIaPusej-JdTj5Z9BOGf9dIaL6ukAHylBV4VwMj/exec";
    let attendanceLogs = [];

    function submitAttendance() {
        const name = document.getElementById('employeeName').value;
        const action = document.getElementById('action').value;
        const statusMsg = document.getElementById('statusMessage');

        if (!name) {
            statusMsg.style.color = "red";
            statusMsg.innerText = "Please select your name!";
            return;
        }

        statusMsg.style.color = "orange";
        statusMsg.innerText = "Saving attendance...";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, action: action })
        })
        .then(() => {
            const now = new Date();
            statusMsg.style.color = "green";
            statusMsg.innerText = `${name} logged ${action} successfully!`;
            
            // Add to local calendar preview
            attendanceLogs.push({ day: now.getDate(), name: name, action: action });
            renderCalendar();
            document.getElementById('attendanceForm').reset();
        })
        .catch(error => {
            statusMsg.style.color = "red";
            statusMsg.innerText = "Error saving. Try again!";
        });
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const title = document.getElementById('calendarTitle');
        grid.innerHTML = '';

        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        title.innerText = `${monthNames[month]} ${year} Attendance`;

        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        days.forEach(d => {
            grid.innerHTML += `<div class="day-header">${d}</div>`;
        });

        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();

        for (let i = 0; i < firstDay; i++) {
            grid.innerHTML += `<div class="day-cell"></div>`;
        }

        for (let day = 1; day <= daysInMonth; day++) {
            let logsForDay = attendanceLogs.filter(l => l.day === day);
            let badgesHtml = '';
            
            logsForDay.forEach(l => {
                let badgeClass = l.action === 'Check-In' ? 'bg-checkin' : 'bg-checkout';
                badgesHtml += `<div class="badge ${badgeClass}">${l.name.split(' ')[0]}</div>`;
            });

            grid.innerHTML += `
                <div class="day-cell">
                    <div class="day-number">${day}</div>
                    ${badgesHtml}
                </div>
            `;
        }
    }

    // Initial render
    renderCalendar();
</script>

</body>
</html>
